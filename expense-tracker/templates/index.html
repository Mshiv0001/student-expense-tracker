<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💰 Expense Tracker</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/style.css"/>
</head>

<body>

<!-- ── Navbar ───────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg sticky-top" id="navbar">
  <div class="container">

    <!-- Brand with fancy font -->
    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
      <div class="brand-icon">
        <i class="bi bi-wallet2"></i>
      </div>
      <span class="brand-name">Expense<span class="brand-accent">Tracker</span></span>
    </a>

    <div class="ms-auto d-flex align-items-center gap-3">
      <!-- Month Picker -->
      <input type="month" id="monthPicker" class="form-control form-control-sm month-picker" style="width:155px"/>

      <!-- Animated Dark Mode Toggle -->
      <label class="theme-toggle" title="Toggle dark mode">
        <input type="checkbox" id="themeToggle"/>
        <span class="toggle-track">
          <span class="toggle-thumb">
            <span class="toggle-icon sun"><i class="bi bi-sun-fill"></i></span>
            <span class="toggle-icon moon"><i class="bi bi-moon-fill"></i></span>
          </span>
          <span class="toggle-stars">
            <span></span><span></span><span></span>
          </span>
        </span>
      </label>
    </div>
  </div>
</nav>

<!-- ── Page Header ────────────────────────────────────────────────────── -->
<div class="page-hero">
  <div class="container">
    <p class="hero-subtitle">Track every rupee, every day 💸</p>
  </div>
</div>

<!-- ── Main ─────────────────────────────────────────────────────────────── -->
<div class="container pb-5">

  <!-- Summary Cards -->
  <div class="row g-3 mb-4">
    <div class="col-sm-6 col-lg-3">
      <div class="stat-card card-hover" id="card-total">
        <div class="stat-icon" style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">
          <i class="bi bi-cash-stack"></i>
        </div>
        <div class="stat-info">
          <div class="stat-label">Total This Month</div>
          <div class="stat-value" id="totalAmt">₹0</div>
        </div>
        <div class="stat-glow" style="background:#6366f133"></div>
      </div>
    </div>
    <div class="col-sm-6 col-lg-3">
      <div class="stat-card card-hover" id="card-count">
        <div class="stat-icon" style="background:linear-gradient(135deg,#10b981,#059669)">
          <i class="bi bi-receipt-cutoff"></i>
        </div>
        <div class="stat-info">
          <div class="stat-label">Total Entries</div>
          <div class="stat-value" id="countAmt">0</div>
        </div>
        <div class="stat-glow" style="background:#10b98133"></div>
      </div>
    </div>
    <div class="col-sm-6 col-lg-3">
      <div class="stat-card card-hover">
        <div class="stat-icon" style="background:linear-gradient(135deg,#f59e0b,#d97706)">
          <i class="bi bi-trophy"></i>
        </div>
        <div class="stat-info">
          <div class="stat-label">Top Category</div>
          <div class="stat-value" id="topCat">—</div>
        </div>
        <div class="stat-glow" style="background:#f59e0b33"></div>
      </div>
    </div>
    <div class="col-sm-6 col-lg-3">
      <div class="stat-card card-hover">
        <div class="stat-icon" style="background:linear-gradient(135deg,#ef4444,#dc2626)">
          <i class="bi bi-graph-down-arrow"></i>
        </div>
        <div class="stat-info">
          <div class="stat-label">Daily Average</div>
          <div class="stat-value" id="avgAmt">₹0</div>
        </div>
        <div class="stat-glow" style="background:#ef444433"></div>
      </div>
    </div>
  </div>

  <div class="row g-4">

    <!-- Left col: Add form + Table -->
    <div class="col-lg-7">

      <!-- Add Expense Card -->
      <div class="glass-card mb-4">
        <div class="glass-card-header">
          <i class="bi bi-plus-circle-fill me-2"></i>Add New Expense
        </div>
        <div class="glass-card-body">
          <form id="expenseForm">
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="field-label">Description *</label>
                <input type="text" id="name" class="form-control custom-input" placeholder="e.g. Canteen lunch" required/>
              </div>
              <div class="col-sm-6">
                <label class="field-label">Amount (₹) *</label>
                <div class="input-group">
                  <span class="input-group-text rupee-sign">₹</span>
                  <input type="number" id="amount" class="form-control custom-input" placeholder="0.00" min="0" step="0.01" required/>
                </div>
              </div>
              <div class="col-sm-6">
                <label class="field-label">Category</label>
                <select id="category" class="form-select custom-input">
                  <option>🍔 Food</option>
                  <option>🚌 Transport</option>
                  <option>📚 Study</option>
                  <option>🎮 Entertainment</option>
                  <option>💊 Health</option>
                  <option>🛍️ Shopping</option>
                  <option>📦 Other</option>
                </select>
              </div>
              <div class="col-sm-6">
                <label class="field-label">Date</label>
                <input type="date" id="date" class="form-control custom-input"/>
              </div>
              <div class="col-12">
                <label class="field-label">Note <span class="text-muted fw-normal">(optional)</span></label>
                <input type="text" id="note" class="form-control custom-input" placeholder="Any extra detail…"/>
              </div>
              <div class="col-12">
                <button type="submit" class="btn-add-expense">
                  <i class="bi bi-plus-lg me-1"></i> Add Expense
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Expense Table -->
      <div class="glass-card">
        <div class="glass-card-header d-flex align-items-center justify-content-between">
          <span><i class="bi bi-table me-2"></i>Expense Log</span>
          <div class="search-wrap">
            <i class="bi bi-search search-icon"></i>
            <input type="text" id="searchBox" class="search-input" placeholder="Search…"/>
          </div>
        </div>
        <div class="glass-card-body p-0">
          <div class="table-scroll">
            <table class="expense-table" id="expenseTable">
              <thead>
                <tr>
                  <th>Description</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th class="text-end">Amount</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="expenseBody">
                <tr>
                  <td colspan="5" class="empty-state">
                    <i class="bi bi-inbox fs-1 d-block mb-2 opacity-25"></i>
                    No expenses yet. Add your first one above!
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div><!-- /left col -->

    <!-- Right col: Charts -->
    <div class="col-lg-5">

      <!-- Pie Chart -->
      <div class="glass-card mb-4">
        <div class="glass-card-header">
          <i class="bi bi-pie-chart-fill me-2"></i>Spending by Category
        </div>
        <div class="glass-card-body d-flex justify-content-center" style="height:270px">
          <canvas id="pieChart"></canvas>
        </div>
      </div>

      <!-- Bar Chart -->
      <div class="glass-card">
        <div class="glass-card-header">
          <i class="bi bi-bar-chart-fill me-2"></i>Daily Spending
        </div>
        <div class="glass-card-body" style="height:245px">
          <canvas id="barChart"></canvas>
        </div>
      </div>

    </div><!-- /right col -->

  </div><!-- /row -->
</div><!-- /container -->

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
  <div id="toast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg">Done!</div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
